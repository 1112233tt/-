<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>六大排序算法学习平台(增强版)</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root {
  --primary-bg: #f7f9fc;
  --panel-bg: #fff;
  --text-color: #222;
  --primary-btn: #4169E1;
}
*{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft YaHei",sans-serif}
body{background:var(--primary-bg);color:var(--text-color);transition: all 0.3s ease}
.container{max-width:1400px;margin:0 auto;padding:12px}
.panel{background:var(--panel-bg);border-radius:12px;padding:16px;margin:12px 0;box-shadow:0 2px 10px #00000010;transition: all 0.3s ease}
.btn{padding:8px 14px;background:var(--primary-btn);color:white;border:none;border-radius:8px;margin:4px;cursor:pointer;transition: opacity 0.2s}.btn:hover{opacity:.9}
.btn-green{background:#28a745}
.btn-orange{background:#fd7e14}
.btn-red{background:#dc3545}
.btn-purple{background:#6f42c1}
.btn-gray{background:#6c757d}
.btn-sm{padding:6px 10px;font-size:13px}
.admin-btn{background:#6610f2; margin-left:12px}
.screen-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.screen{border:1px solid #e0e0e0;border-radius:10px;padding:10px}
.bar-box{display:flex;gap:3px;align-items:flex-end;height:220px;padding:4px;background:#f8f9fa;border-radius:8px;overflow:hidden}
.bar{flex:1;min-width:3px;max-width:50px;background:#4169E1;border-radius:2px 2px 0 0;transition:height 0.15s ease}
.bar.active{background:#dc3545}
.bar.done{background:#28a745}
.modal{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:none;align-items:center;justify-content:center;z-index:99}
.modal-body{background:white;padding:24px;border-radius:12px;min-width:360px;max-height:80vh;overflow-y:auto}
.chart-box{height:320px;margin:12px 0}
.question{margin:12px 0;padding:12px;background:#f8f9fa;border-radius:8px}
.option{margin:6px 0}
.log-box{max-height:220px;overflow-y:auto}
.log{padding:6px;margin:4px;background:#f1f3f5;border-radius:6px;font-size:14px}
.star{font-size:24px;cursor:pointer;color:#ccc}
.star.on{color:#ffc107}
.rank-item{display:flex;justify-content:space-between;padding:6px;margin:4px;background:#f1f3f5;border-radius:6px}
.feedback-item{display:block;padding:12px;margin:8px 0;background:#f8f9fa;border-radius:8px;border:1px solid #eee}
.feedback-user{font-weight:bold;color:#333}
.feedback-stars{color:#ff9800;margin:0 8px}
.feedback-time{font-size:12px;color:#666}
.feedback-text{margin-top:8px;padding-top:8px;border-top:1px solid #ddd}
.congrats{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font-size:32px;color:#28a745;font-weight:bold;animation:jump 1s infinite;z-index:100;background:white;padding:20px;border-radius:12px;box-shadow:0 0 20px rgba(0,0,0,0.2)}
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;margin:12px 0}
.card{padding:16px;border:1px solid #e0e0e0;border-radius:10px;line-height:1.6}
input,textarea,select{width:100%;padding:8px;border-radius:8px;border:1px solid #ccc;margin:6px 0}
.title{margin-bottom:12px}
pre{background:#f8f9fa;padding:8px;border-radius:4px;overflow-x:auto}
.info-text{color:#222;background:#e67ff;padding:8px;border-radius:6px;margin-top:6px;font-size:14px}
.algo-label{font-size:14px;color:#165DFF;margin-bottom:4px;font-weight:bold}
.password-input{margin:12px 0;font-family:monospace}
.difficulty-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;margin-left:8px}
.difficulty-easy{background:#d4edda;color:#155724}
.difficulty-medium{background:#fff3cd;color:#856404}
.difficulty-hard{background:#f8d7da;color:#721c24}
.difficulty-original{background:#e2d9f3;color:#6f42c1}
.type-tag{display:inline-block;padding:2px 8px;border-radius:12px;font-size:12px;margin-right:8px;background:#e9ecef;color:#495057}
.progress-bar{height:6px;background:#e9ecef;border-radius:3px;margin:8px 0}
.progress-fill{height:100%;background:#28a745;border-radius:3px;transition:width 0.3s}
.ai-menu{background:#f0f4ff; padding:12px; border-radius:8px; margin-bottom:10px; border-left:4px solid #4169E1; font-size:14px; line-height:1.8;}
.ai-menu b{color:#4169E1}
</style>
</head>
<body>
<div class="container">
<!-- 顶部用户面板 -->
<div class="panel" id="userPanel">
  <div id="userInfo"></div>

<!-- 算法介绍 -->
<div class="panel">
<h2 class="title">算法原理详解(完整版)</h2>

</div>
</div>

<!-- ==================== 模态窗口 ==================== -->

<!-- 自定义数据 -->
<div class="modal" id="customModal"><div class="modal-body">
<h3>自定义数组</h3>
<input id="customArr" placeholder="例如:10,30,50,20,70">

</div></div>

<!-- 练习 -->
<div class="modal" id="practiceModal"><div class="modal-body">
<h3>在线练习 <span style="font-size:14px;color:#666">(基础题随机抽取)</span></h3>

<div class="progress-bar"><div class="progress-fill" id="practiceProgress" style="width:0%"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:12px">
  <button class="btn btn-green" onclick="submitPractice()">提交练习</button>
  <button class="btn btn-red" onclick="closeModal('practiceModal')">关闭</button>
</div>
</div></div>

<!-- 考试 -->
<div class="modal" id="examModal"><div class="modal-body">
<h3>模拟考试 <span style="font-size:14px;color:#666">(高级/基础/进阶/原创混合)</span></h3>
<div id="examArea"></div>
<div class="progress-bar"><div class="progress-fill" id="examProgress" style="width:0%"></div></div>
<div style="display:flex;justify-content:space-between;margin-top:12px">
  <button class="btn btn-green" onclick="submitExam()">交卷</button>

</div></div>

<!-- 反馈 -->
<div class="modal" id="feedbackModal"><div class="modal-body">
<h3>用户反馈</h3>
<div>
<span class="star" onclick="setStar(1)">★</span>
<span class="star" onclick="setStar(2)">★</span>
<span class="star" onclick="setStar(3)">★</span>
<span class="star" onclick="setStar(4)">★</span>
<span class="star" onclick="setStar(5)">★</span>
</div>
<textarea rows="4" id="feedText" placeholder="请输入反馈内容"></textarea>
<button class="btn" onclick="submitFeedback()">提交反馈</button>
<button class="btn btn-red" onclick="closeModal('feedbackModal')">关闭</button>
</div></div>

<!-- AI助手 -->
<div class="modal" id="aiModal"><div class="modal-body">
<h3>🤖 AI个性化助手</h3>
<div id="aiMenuContainer"></div>
<div id="aiReply" style="min-height:80px;background:#f8f9fa;padding:10px;border-radius:8px;margin:10px 0;"></div>
<input id="askAI" placeholder="输入功能编号(如1)或提问">
<button class="btn" onclick="askAI()">执行/提问</button>
<button class="btn btn-red" onclick="closeModal('aiModal')">关闭</button>
</div></div>

<!-- 图表 -->
<div class="modal" id="chartModal"><div class="modal-body">
<h3>多维度对比图表</h3>
<div class="chart-box"><canvas id="chartTime"></canvas></div>

<!-- 记录 -->

</div></div>

<!-- 管理员登录模态窗 -->
<div class="modal" id="adminLoginModal"><div class="modal-body">
<h3>🔐 管理员登录</h3>
<p style="color:#666;font-size:14px;margin-bottom:12px">输入管理密码查看所有用户反馈</p>
<input type="password" id="adminPassword" class="password-input" placeholder="输入管理员密码">

  <button class="btn btn-red" onclick="closeModal('adminLoginModal')">取消</button>

</div></div>

<!-- 管理员后台模态窗 -->
<div class="modal" id="adminBackendModal"><div class="modal-body" style="min-width:600px">
<h3>📊 反馈管理中心</h3>
<div style="margin-bottom:12px;display:flex;justify-content:space-between;align-items:center">
  <div>
    <span style="font-size:14px;color:#666">总反馈数: <span id="totalFeedbacks">0</span> 条</span>
    <span style="font-size:14px;color:#666;margin-left:12px">平均评分: <span id="avgRating">0.0</span></span>
  </div>
  <div>
    <button class="btn btn-purple btn-sm" onclick="exportFeedbacks()">📥 导出</button>

  </div>
</div>
<div id="allFeedbacksList" style="max-height:400px;overflow-y:auto;margin-top:12px"></div>
</div></div>

<div class="modal" id="changePwdModal"><div class="modal-body">
<h3>🔑 修改管理员密码</h3>
<div style="margin:12px 0">
  <input type="password" id="oldPwdInput" class="password-input" placeholder="原密码">
  <input type="password" id="newPwdInput" class="password-input" placeholder="新密码 (至少6位)">
  <input type="password" id="confirmPwdInput" class="password-input" placeholder="确认新密码">
</div>
<div style="display:flex;gap:8px">
  <button class="btn btn-green" onclick="updateAdminPassword()">确定修改</button>
  <button class="btn btn-red" onclick="cancelChangePwd()">取消</button>
</div>
</div></div>

<script>
// ==================== 全局变量 ====================
let running = false;
let stopFlag = false;
let isChangingPwd = false;

// 从本地存储获取用户，不存在则弹窗创建
let user = localStorage.getItem("sort_user") || prompt("请输入用户名:");
if(user) localStorage.setItem("sort_user", user);

// 初始化管理员密码（默认'admin123'）
if (!localStorage.getItem("admin_password")) {
  localStorage.setItem("admin_password", "admin123");
}

// 个性化配置初始化
if (!localStorage.getItem("user_theme")) {
  localStorage.setItem("user_theme", JSON.stringify({bg:"#f7f9fc", panelBg:"#fff", textColor:"#222", btnColor:"#4169E1", layout:"grid"}));
}

let algoList = [
  {name:"冒泡排序", key:"bubble", color:"#4169E1"},
  {name:"选择排序", key:"select", color:"#fd7e14"},
  {name:"插入排序", key:"insert", color:"#20c997"},
  {name:"希尔排序", key:"shell", color:"#6f42c1"},
  {name:"归并排序", key:"merge", color:"#d63384"},
  {name:"快速排序", key:"quick", color:"#198754"},
];

let screens = [];
let arrOrigin = [];
let arrList = [];
let stats = [];
let star = 0;
let baseDelay = 120;
let currentPracticeQuestions = [];
let currentExamQuestions = [];

// ==================== 扩充后的题库数据 ====================
const questionBank = {
  // 基础题库 (难度: easy)
  easy: [
    {type:"单选", q:"冒泡排序的平均时间复杂度是?", opts:["O(n)","O(n²)","O(nlogn)","O(1)"], ans:"O(n²)", score:5},
    {type:"判断", q:"冒泡排序是稳定排序算法?", ans:true, score:5},
    {type:"单选", q:"选择排序的空间复杂度是?", opts:["O(n)","O(n²)","O(1)","O(logn)"], ans:"O(1)", score:5},
    {type:"单选", q:"插入排序的最坏时间复杂度是?", opts:["O(n)","O(n²)","O(nlogn)","O(1)"], ans:"O(n²)", score:5},
    {type:"判断", q:"选择排序是稳定排序算法?", ans:false, score:5},
    {type:"单选", q:"归并排序需要额外的存储空间?", opts:["需要","不需要"], ans:"需要", score:5},
    {type:"判断", q:"快速排序是最坏的排序算法?", ans:false, score:5},
    {type:"单选", q:"希尔排序又称为?", opts:["缩小增量排序","冒泡排序","快速排序","归并排序"], ans:"缩小增量排序", score:5},
  ],
  // 进阶题库 (难度: medium)
  medium: [
    {type:"多选", q:"下列属于稳定排序算法的是?", opts:["冒泡排序","插入排序","快速排序","归并排序"], ans:["冒泡排序","插入排序","归并排序"], score:10},
    {type:"单选", q:"快速排序在最坏情况下的时间复杂度是?", opts:["O(n)","O(nlogn)","O(n²)","O(1)"], ans:"O(n²)", score:8},
    {type:"判断", q:"希尔排序是插入排序的改进版本?", ans:true, score:8},
    {type:"程序", q:"冒泡排序的核心交换语句是?", ans:"if(arr[j] > arr[j+1]) { swap(arr[j], arr[j+1]); }", score:10},
    {type:"单选", q:"快速排序每次划分的核心思想是?", opts:["分治","贪心","动态规划","回溯"], ans:"分治", score:8},
    {type:"判断", q:"归并排序是原地排序算法?", ans:false, score:8},
  ],
  // 高级题库 (难度: hard)
  hard: [
    {type:"多选", q:"下列算法中平均时间复杂度为O(nlogn)的是?", opts:["冒泡排序","快速排序","归并排序","希尔排序"], ans:["快速排序","归并排序","希尔排序"], score:15},
    {type:"单选", q:"归并排序的空间复杂度是?", opts:["O(1)","O(n)","O(logn)","O(n²)"], ans:"O(n)", score:12},
    {type:"程序", q:"快速排序分区函数的核心代码是?", ans:"while(i < j) { while(i < j && arr[j] >= pivot) j--; arr[i] = arr[j]; while(i < j && arr[i] <= pivot) i++; arr[j] = arr[i]; }", score:15},
    {type:"单选", q:"在数据基本有序的情况下，哪种排序算法效率最高?", opts:["快速排序","插入排序","选择排序","归并排序"], ans:"插入排序", score:12},
    {type:"判断", q:"快速排序的空间复杂度最坏为O(n)?", ans:true, score:15},
  ],
  // 原创题库 (难度: original)
  original: [
    {type:"程序", q:"请手写一个优化版的冒泡排序（增加flag判断是否已有序）", ans:"bool flag = true; for(int i=0; i<n-1 && flag; i++) { flag=false; for(int j=0; j<n-i-1; j++) if(arr[j]>arr[j+1]){ swap; flag=true; } }", score:20},
    {type:"程序", q:"请实现将两个已排序数组合并为一个有序数组的merge函数", ans:"while(i<a.length && j<b.length) { if(a[i]<=b[j]) c[k++]=a[i++]; else c[k++]=b[j++]; } while(i<a.length) c[k++]=a[i++]; while(j<b.length) c[k++]=b[j++];", score:20},
    {type:"单选", q:"若待排序列存在大量重复元素，以下哪种排序优化后效率最高?", opts:["三路快排","普通快排","冒泡排序","选择排序"], ans:"三路快排", score:20},
    {type:"判断", q:"对于小规模数据，插入排序的实际执行速度可能快于快速排序?", ans:true, score:20},
  ]
};

const algoIntro = {
  bubble: '<h4>冒泡排序</h4><p>重复比较交换相邻元素,大值下沉</p><p>时间 O(n²) 空间O(1) 稳定</p>',
  select: '<h4>选择排序</h4><p>每轮选最小值放到前面</p><p>时间 O(n²) 空间 O(1) 不稳定</p>',
  insert: '<h4>插入排序</h4><p>将当前元素插入前面有序区</p><p>时间 O(n²) 空间 O(1) 稳定</p>',
  shell: '<h4>希尔排序</h4><p>分组插入+缩小增量</p><p>时间 O(nlogn) 空间 O(1) 不稳定</p>',
  merge: '<h4>归并排序</h4><p>分治+合并有序数组</p><p>时间 O(nlogn) 空间 O(n) 稳定</p>',
  quick: '<h4>快速排序</h4><p>基准分区递归排序</p><p>时间 O(nlogn) 空间 O(logn) 不稳定</p>'
};

// ==================== 页面初始化 ====================
window.onload = function() {
  initScreens();
  initAlgoCards();
  loadRecord();
  genRandom();
  refreshUserPanel();
  closeAllModals();
  applyUserTheme(); // 应用用户个性化主题
};

// ==================== 通用函数 ====================
function closeModal(modalId) { 
  document.getElementById(modalId).style.display = "none";
}

function closeAllModals() { 
  document.querySelectorAll(".modal").forEach(m => m.style.display = "none");
}

// 随机抽取数组中的n个元素
function getRandomItems(arr, n) {
  let shuffled = arr.slice();
  for (let i = shuffled.length - 1; i > 0; i--) {
    let j = Math.floor(Math.random() * (i + 1));
    [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
  }
  return shuffled.slice(0, n);
}

// ==================== 个性化主题相关 ====================
function applyUserTheme() {
  let theme = JSON.parse(localStorage.getItem("user_theme"));
  document.documentElement.style.setProperty('--primary-bg', theme.bg);
  document.documentElement.style.setProperty('--panel-bg', theme.panelBg);
  document.documentElement.style.setProperty('--text-color', theme.textColor);
  document.documentElement.style.setProperty('--primary-btn', theme.btnColor);
  
  let screensDiv = document.getElementById("screens");
  if(theme.layout === "list") {
    screensDiv.style.gridTemplateColumns = "1fr";
  } else {
    screensDiv.style.gridTemplateColumns = "repeat(2,1fr)";
  }
}

function changeTheme(bg, panelBg, textColor, btnColor, layout) {
  let theme = JSON.parse(localStorage.getItem("user_theme"));
  if(bg) theme.bg = bg;
  if(panelBg) theme.panelBg = panelBg;
  if(textColor) theme.textColor = textColor;
  if(btnColor) theme.btnColor = btnColor;
  if(layout) theme.layout = layout;
  
  localStorage.setItem("user_theme", JSON.stringify(theme));
  applyUserTheme();
}

// ==================== 可视化初始化 ====================
function initScreens() {
  let wrap = document.getElementById("screens");
  wrap.innerHTML = "";
  screens = [];
  
  algoList.forEach((al, idx) => {
    let div = document.createElement("div");
    div.className = "screen";
    div.innerHTML = `
      <div class="algo-label">${al.name}</div>
      <div class="info-text" id="tip${idx}">等待...</div>
      <div class="bar-box" id="scr${idx}"></div>
    `;
    wrap.appendChild(div);
    
    screens.push({
      bar: document.getElementById(`scr${idx}`),
      tip: document.getElementById(`tip${idx}`)
    });
  });
}

function initAlgoCards() {
  let wrap = document.getElementById("algoCards");
  wrap.innerHTML = "";
  algoList.forEach(al => {
    let card = document.createElement("div");
    card.className = "card";
    card.innerHTML = algoIntro[al.key];
    wrap.appendChild(card);
  });
}

function getDelay() {
  let rate = parseFloat(document.getElementById("speedSelect").value);
  return baseDelay / rate;
}

function draw(arr, idx, actA = -1, actB = -1) {

  box.innerHTML = "";

// ==================== 排序算法实现 ====================
async function bubble(arr, idx) {
  let t = performance.now(), cmp = 0, swp = 0, n = arr.length;
  let tip = screens[idx].tip;
  
  for (let i = 0; i < n - 1; i++) {
    for (let j = 0; j < n - i - 1; j++) {
      if (stopFlag) return;
      cmp++;
      tip.innerText = `比较 ${arr[j]} ↔ ${arr[j + 1]}`;
      draw(arr, idx, j, j + 1);
      await sleep(getDelay());
      
      if (arr[j] > arr[j + 1]) {
        swp++;
        tip.innerText = `交换 ${arr[j]} ↔ ${arr[j + 1]}`;
        [arr[j], arr[j + 1]] = [arr[j + 1], arr[j]];
        draw(arr, idx, j, j + 1);
        await sleep(getDelay());
      }
    }
  }
  
  tip.innerText = "完成";
  return { name: algoList[idx].name, time: (performance.now() - t) / 1000, cmp, swp };
}

async function select(arr, idx) {
  let t = performance.now(), cmp = 0, swp = 0, n = arr.length;
  let tip = screens[idx].tip;
  
  for (let i = 0; i < n - 1; i++) {
    let m = i;
    for (let j = i + 1; j < n; j++) {
      if (stopFlag) return;
      cmp++;
      tip.innerText = `比较 ${arr[j]} ↔ ${arr[m]}`;
      draw(arr, idx, m, j);
      await sleep(getDelay());
      if (arr[j] < arr[m]) m = j;
    }
    
    if (m !== i) {
      swp++;
      tip.innerText = `交换 ${arr[i]} ↔ ${arr[m]}`;
      [arr[i], arr[m]] = [arr[m], arr[i]];
      draw(arr, idx, i, m);
      await sleep(getDelay());
    }
  }
  
  tip.innerText = "完成";
  return { name: algoList[idx].name, time: (performance.now() - t) / 1000, cmp, swp };
}

async function insert(arr, idx) {
  let t = performance.now(), cmp = 0, swp = 0, n = arr.length;
  let tip = screens[idx].tip;
  
  for (let i = 1; i < n; i++) {
    let k = arr[i], j = i - 1;
    while (j >= 0 && arr[j] > k) {
      if (stopFlag) return;
      cmp++;
      tip.innerText = `比较 ${arr[j]} ↔ ${k}`;
      draw(arr, idx, j);
      arr[j + 1] = arr[j];
      j--;
      swp++;
      await sleep(getDelay());
    }
    arr[j + 1] = k;
    draw(arr, idx, i);
    await sleep(getDelay());
  }
  
  tip.innerText = "完成";
  return { name: algoList[idx].name, time: (performance.now() - t) / 1000, cmp, swp };
}

async function shell(arr, idx) {
  let t = performance.now(), cmp = 0, swp = 0, n = arr.length, gap = n >> 1;
  let tip = screens[idx].tip;
  
  while (gap > 0) {
    for (let i = gap; i < n; i++) {
      let k = arr[i], j = i;
      while (j >= gap && arr[j - gap] > k) {
        if (stopFlag) return;
        cmp++;
        tip.innerText = `比较 ${arr[j - gap]} ↔ ${k}`;
        arr[j] = arr[j - gap];
        j -= gap;
        swp++;
        await sleep(getDelay());
      }
      arr[j] = k;
      draw(arr, idx, i);
      await sleep(getDelay());
    }
    gap >>= 1;
  }
  
  tip.innerText = "完成";
  return { name: algoList[idx].name, time: (performance.now() - t) / 1000, cmp, swp };
}

async function merge(arr, idx) {
  let t = performance.now(), cmp = 0;
  let tip = screens[idx].tip;
  
  async function ms(l, r) {
    if (l >= r || stopFlag) return;
    let m = (l + r) >> 1;
    await ms(l, m);
    await ms(m + 1, r);
    
    let a = [], i = l, j = m + 1;
    while (i <= m && j <= r) {
      if (stopFlag) return;
      cmp++;
      tip.innerText = `比较 ${arr[i]} ↔ ${arr[j]}`;
      a.push(arr[i] < arr[j] ? arr[i++] : arr[j++]);
      draw(arr, idx, i, j);
      await sleep(getDelay() * 0.5);
    }
    
    while (i <= m) a.push(arr[i++]);
    while (j <= r) a.push(arr[j++]);
    
    for (let p = l; p <= r; p++) {
      arr[p] = a[p - l];
      draw(arr, idx, p);
      await sleep(getDelay() * 0.3);
    }
  }
  
  await ms(0, arr.length - 1);
  tip.innerText = "完成";
  return { name: algoList[idx].name, time: (performance.now() - t) / 1000, cmp, swp: 0 };
}

async function quick(arr, idx) {
  let t = performance.now(), cmp = 0, swp = 0;
  let tip = screens[idx].tip;
  
  async function qs(l, r) {
    if (l >= r || stopFlag) return;
    let p = arr[l], i = l, j = r;
    
    while (i < j) {
      while (arr[j] >= p && i < j) {
        if (stopFlag) return;
        cmp++;
        tip.innerText = `比较 ${arr[j]} ↔ ${p}`;
        j--;
        draw(arr, idx, j);
        await sleep(getDelay() * 0.5);
      }
      
      while (arr[i] <= p && i < j) {
        if (stopFlag) return;
        cmp++;
        tip.innerText = `比较 ${arr[i]} ↔ ${p}`;
        i++;
        draw(arr, idx, i);
        await sleep(getDelay() * 0.5);
      }
      
      if (i < j) {
        swp++;
        tip.innerText = `交换 ${arr[i]} ↔ ${arr[j]}`;
        draw(arr, idx, i, j);
        [arr[i], arr[j]] = [arr[j], arr[i]];
        await sleep(getDelay());
      }
    }
    
    arr[l] = arr[i];
    arr[i] = p;
    draw(arr, idx, i);
    await qs(l, i - 1);
    await qs(i + 1, r);
  }
  
  await qs(0, arr.length - 1);
  tip.innerText = "完成";
  return { name: algoList[idx].name, time: (performance.now() - t) / 1000, cmp, swp };
}

async function startAll() {
  if (running) return;
  running = true;
  stopFlag = false;
  resetDraw();
  
  let tasks = [
    bubble([...arrList[0]], 0),
    select([...arrList[1]], 1),
    insert([...arrList[2]], 2),
    shell([...arrList[3]], 3),
    merge([...arrList[4]], 4),
    quick([...arrList[5]], 5)
  ];
  
  stats = await Promise.all(tasks);
  addLog("6路排序全部完成");
  running = false;
}

}

// ==================== 优化后的练习/考试功能 ====================
function renderPaper(questions, mode) {
  let html = "";
  let totalScore = 0;
  
  const difficultyNames = { easy: "基础题", medium: "进阶题", hard: "高级题", original: "原创题" };
  const difficulties = ["easy", "medium", "hard", "original"];
  
  difficulties.forEach(diff => {
    const diffQuestions = questions.filter(q => q.difficulty === diff);
    if (diffQuestions.length === 0) return;
    
    html += `<div style="margin:20px 0 10px;padding-bottom:8px;border-bottom:2px solid #eee">
      <h4 style="color:#333">${difficultyNames[diff]} <span style="font-size:14px;color:#666">(${diffQuestions.length}题)</span></h4>
    </div>`;
    
    diffQuestions.forEach((q, idx) => {
      totalScore += q.score;
      const qNum = questions.indexOf(q) + 1;
      
      html += `<div class="question">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div>
            <span class="type-tag">${q.type}</span>
            <strong>${qNum}. ${q.q}</strong>
          </div>
          <div>
            <span class="difficulty-tag difficulty-${q.difficulty}">${difficultyNames[diff]}</span>
            <span style="font-weight:bold;color:#4169E1">${q.score}分</span>
          </div>
        </div>`;
      
      if (q.type === "单选") {
        q.opts.forEach(o => {
          html += `<div class="option"><label><input type="radio" name="${mode}${qNum}" value="${o}"> ${o}</label></div>`;
        });
      }
      
      if (q.type === "多选") {
        q.opts.forEach(o => {
          html += `<div class="option"><label><input type="checkbox" name="${mode}${qNum}" value="${o}"> ${o}</label></div>`;
        });
      }
      
      if (q.type === "判断") {
        html += `<div class="option">
          <label><input type="radio" name="${mode}${qNum}" value="true"> 对</label>
          <label><input type="radio" name="${mode}${qNum}" value="false"> 错</label>
        </div>`;
      }
      
      if (q.type === "程序") {
        html += `<div><textarea rows="3" name="${mode}${qNum}" placeholder="请输入代码..."></textarea></div>`;
      }
      
      html += '</div>';
    });
  });
  
  document.getElementById(mode === "exam" ? "examArea" : "practiceArea").innerHTML = html;
  
  const inputs = document.querySelectorAll(`#${mode === "exam" ? "examArea" : "practiceArea"} input, textarea`);
  inputs.forEach(input => {
    input.addEventListener("change", () => updateProgress(questions, mode));
  });
}

function updateProgress(questions, mode) {
  let answered = 0;
  
  questions.forEach((q, idx) => {
    const qNum = idx + 1;
    let answeredThis = false;
    
    if (q.type === "单选" || q.type === "判断") {
      answeredThis = document.querySelector(`input[name="${mode}${qNum}"]:checked`) !== null;
    } else if (q.type === "多选") {
      answeredThis = document.querySelectorAll(`input[name="${mode}${qNum}"]:checked`).length > 0;
    } else if (q.type === "程序") {
      answeredThis = document.querySelector(`textarea[name="${mode}${qNum}"]`).value.trim().length > 0;
    }
    
    if (answeredThis) answered++;
  });
  
  const progress = (answered / questions.length) * 100;
  const progressBar = mode === "exam" ? "examProgress" : "practiceProgress";
  document.getElementById(progressBar).style.width = `${progress}%`;
}

function grade(questions, mode) {
  let sc = 0;
  let details = [];
  
  questions.forEach((q, idx) => {
    const qNum = idx + 1;
    let v;
    let ok = false;
    
    if (q.type === "单选") {
      v = document.querySelector(`input[name="${mode}${qNum}"]:checked`)?.value || "";
      ok = v === q.ans;
    }
    
    if (q.type === "多选") {
      v = [...document.querySelectorAll(`input[name="${mode}${qNum}"]:checked`)].map(x => x.value);
      ok = JSON.stringify(v.sort()) === JSON.stringify(q.ans.sort());
    }
    
    if (q.type === "判断") {
      v = document.querySelector(`input[name="${mode}${qNum}"]:checked`)?.value === "true";
      ok = v === q.ans;
    }
    
    if (q.type === "程序") {
      v = document.querySelector(`textarea[name="${mode}${qNum}"]`).value.trim();
      ok = q.ans.split(" ").some(keyword => v.includes(keyword)) && v.length > 10;
    }
    
    if (ok) {
      sc += q.score;
      details.push({ q: q.q, correct: true, score: q.score });
    } else {
      details.push({ q: q.q, correct: false, score: 0 });
    }
  });
  
  return { score: sc, details: details };
}

    else if (/快排/.test(q)) a = "快速排序：平均 O(n log n)，最坏 O(n²)，空间 O(log n)，不稳定。原理：选择基准，分区，递归排序左右两部分。";

  }
}

function saveExam(s) {
  let ex = JSON.parse(localStorage.getItem("exams") || "[]");
  ex.push({ score: s, time: new Date().toLocaleString() });
  localStorage.setItem("exams", JSON.stringify(ex));
  loadRecord();
  refreshUserPanel();
}

function refreshUserPanel() {
  let ex = JSON.parse(localStorage.getItem("exams") || "[]");
  let last = ex.length ? ex[ex.length - 1].score : "无";
  userInfo.innerText = `👤 用户: ${user} | 📝 最近成绩: ${last}`;
  recordInfo.innerText = `🕒 上次访问: ${localStorage.getItem("last") || "无"}`;
}

function openRecord() {
  let ex = JSON.parse(localStorage.getItem("exams") || "[]");
  recordList.innerHTML = ex.length ? 
    ex.map(e => `<div class="rank-item"><span>${e.time}</span><span>${e.score}分</span></div>`).join("") 
    : "<p>暂无考试记录</p>";
  document.getElementById("recordModal").style.display = "flex";
}

function addLog(s) {
  log.innerHTML += `<div class="log">${new Date().toLocaleString()} ${s}</div>`;
  log.scrollTop = log.scrollHeight;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

// =============================================================================
// 🔐 管理员后台相关功能
// =============================================================================

function openAdminLogin() {
  document.getElementById("adminLoginModal").style.display = "flex";
  document.getElementById("adminPassword").focus();
}

function checkAdminPassword() {
  const inputPwd = document.getElementById("adminPassword").value;
  const savedPwd = localStorage.getItem("admin_password") || "admin123";
  
  if (inputPwd === savedPwd) {
    closeModal("adminLoginModal");
    openAdminBackend();
  } else {
    alert("❌ 密码错误！");
  }
}

function changeAdminMode() {
  isChangingPwd = true;
  closeModal("adminLoginModal");
  openChangePassword();
}

function openChangePassword() {
  document.getElementById("changePwdModal").style.display = "flex";
}

function cancelChangePwd() {
  document.getElementById("changePwdModal").style.display = "none";
  setTimeout(() => openAdminLogin(), 200);
}

function updateAdminPassword() {
  const oldPwd = document.getElementById("oldPwdInput").value;
  const newPwd = document.getElementById("newPwdInput").value;
  const confirmPwd = document.getElementById("confirmPwdInput").value;
  
  const currentPwd = localStorage.getItem("admin_password") || "admin123";
  
  if (oldPwd !== currentPwd) {
    alert("❌ 原密码不正确");
    return;
  }
  
  if (newPwd.length < 6) {
    alert("❌ 新密码至少6位");
    return;
  }
  
  if (newPwd !== confirmPwd) {
    alert("❌ 两次输入的新密码不一致");
    return;
  }
  
  localStorage.setItem("admin_password", newPwd);
  alert("✅ 密码修改成功！");
  closeModal("changePwdModal");
  
  if (isChangingPwd) {
    setTimeout(() => openAdminLogin(), 500);
    isChangingPwd = false;
  }
}

function openAdminBackend() {
  loadAllFeedbacks();
  document.getElementById("adminBackendModal").style.display = "flex";
}

function changeAdminPassword() {
  closeModal("adminBackendModal");
  setTimeout(() => openChangePassword(), 200);
}

function loadAllFeedbacks() {
  const feedbacks = JSON.parse(localStorage.getItem("all_feedbacks") || "[]");
  
  document.getElementById("totalFeedbacks").textContent = feedbacks.length;
  
  if (feedbacks.length > 0) {
    const totalStars = feedbacks.reduce((sum, fb) => sum + fb.star, 0);
    const avgRating = (totalStars / feedbacks.length).toFixed(1);
    document.getElementById("avgRating").textContent = avgRating;
  } else {
    document.getElementById("avgRating").textContent = "0.0";
  }
  
  const listElement = document.getElementById("allFeedbacksList");
  
  if (feedbacks.length === 0) {
    listElement.innerHTML = '<div style="text-align:center;padding:40px;color:#999">暂无用户反馈</div>';
    return;
  }
  
  const sortedFeedbacks = [...feedbacks].reverse();
  
  listElement.innerHTML = sortedFeedbacks.map(fb => `
    <div class="feedback-item">
      <div>
        <span class="feedback-user">👤 ${fb.user}</span>
        <span class="feedback-stars">${'★'.repeat(fb.star)}${'☆'.repeat(5 - fb.star)}</span>
        <span class="feedback-time">${fb.time}</span>
      </div>
      <div class="feedback-text">${fb.text.replace(/\n/g, '<br>')}</div>
    </div>
  `).join("");
}

function exportFeedbacks() {
  const feedbacks = JSON.parse(localStorage.getItem("all_feedbacks") || "[]");
  
  if (feedbacks.length === 0) {
    alert("暂无反馈数据可导出");
    return;
  }
  
  const jsonStr = JSON.stringify(feedbacks, null, 2);
  const blob = new Blob([jsonStr], { type: "application/json" });
  
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `用户反馈_${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  
  alert(`✅ 已导出 ${feedbacks.length} 条反馈`);
}

function clearAllFeedbacks() {
  if (!confirm("⚠️ 确定要清空所有用户反馈吗？此操作不可撤销！")) return;
  
  localStorage.removeItem("all_feedbacks");
  loadAllFeedbacks();
  alert("✅ 所有反馈已清空");
}

function logoutAdmin() {
  closeModal("adminBackendModal");
  document.getElementById("adminPassword").value = "";
}
</script>
